name: source walk

# Walks the source's two hosts and keeps one rolling release (tag `data`):
# csaf-advisories-YYYY.ndjson.gz and csaf-cves-YYYY.ndjson.gz (the CSAF files
# by year), pairs-NNN.ndjson.gz (the CVE database's pairs in slices of 1,000)
# and bulletins.ndjson.gz, indexed by state.json. Each run resumes where the
# last stopped, cools down when the source fails the same way 8 calls in a
# row, parks a record that fails the same way two runs running (retried once
# a day), stops at its time budget, and publishes what it has.
#
# Chaining: when a run ends with work left (its budget, or an error other than
# a stall) and `chain` is above 0, it dispatches one follow-up run of this
# workflow with chain - 1 and every other input unchanged. A run that stalls
# or finishes asks for none. The concurrency group keeps runs one at a time.
#
# Every 4 hours. Once the history is complete a run fetches new CSAF files,
# checks every known file's Last-Modified once a day, re-lists the CVE
# database and fetches the pairs whose updateTime changed, and re-lists the
# notices and fetches the changed details.
#
# Repository secrets (Settings → Secrets and variables → Actions → Secrets),
# masked in every log: SOURCE_BASE, the website API base URL; CSAF_BASE, the
# host CSAF files are fetched from; CSAF_ORIGIN (optional), the CSAF origin,
# whose index lists the files and which serves any file CSAF_BASE lacks.
on:
  schedule:
    - cron: "40 */4 * * *"
  workflow_dispatch:
    inputs:
      chain:
        description: "how many follow-up runs may still follow this one"
        required: false
        default: "3"
      budget:
        description: "minutes the walk may run"
        required: false
        default: "330"
      pace:
        description: "seconds between requests"
        required: false
        default: "0.15"
      burst:
        description: "calls per burst (default 0, no bursts)"
        required: false
        default: ""
      gap:
        description: "seconds between bursts (default 0)"
        required: false
        default: ""
      cooldown:
        description: "minutes to wait after 8 calls in a row failed the same way (default 30)"
        required: false
        default: ""
      force_check:
        description: "true reads every year's origin listing this run, whatever the daily gate says"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write

concurrency:
  group: walk
  cancel-in-progress: false

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: refuse without the source secrets
        env:
          BASE: ${{ secrets.SOURCE_BASE }}
          CSAF_BASE: ${{ secrets.CSAF_BASE }}
        run: |
          if [ -z "$BASE" ]; then echo "::error::repository secret SOURCE_BASE is not set"; exit 1; fi
          if [ -z "$CSAF_BASE" ]; then echo "::error::repository secret CSAF_BASE is not set"; exit 1; fi
      - name: walk
        id: walk
        env:
          BASE: ${{ secrets.SOURCE_BASE }}
          CSAF_BASE: ${{ secrets.CSAF_BASE }}
          CSAF_ORIGIN: ${{ secrets.CSAF_ORIGIN }}
          FORCE_CHECK: ${{ inputs.force_check || 'false' }}
          BUDGET: ${{ inputs.budget || '330' }}
          PACE: ${{ inputs.pace || '0.15' }}
          BURST: ${{ inputs.burst }}
          GAP: ${{ inputs.gap }}
          COOLDOWN: ${{ inputs.cooldown }}
          CHAIN: ${{ inputs.chain || '3' }}
          RELEASE_TAG: data
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SPACES_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
          SPACES_BUCKET: ${{ secrets.SPACES_BUCKET }}
          SPACES_KEY: ${{ secrets.SPACES_KEY }}
          SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
          SPACES_REGION: sgp1
        run: |
          chmod +x bin/source-walk
          sha256sum bin/source-walk
          bin/source-walk
          more=$(sed -n 's/^more=//p' "$GITHUB_OUTPUT" | tail -n 1)
          if [ "$more" != true ] || [ "$CHAIN" -le 0 ]; then
            echo "chain: no follow-up run requested (more=${more:-unset}, chain=$CHAIN)"
          fi
      - name: chain
        if: ${{ success() && steps.walk.outputs.more == 'true' && fromJSON(inputs.chain || '3') > 0 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAIN: ${{ inputs.chain || '3' }}
          BUDGET: ${{ inputs.budget || '330' }}
          PACE: ${{ inputs.pace || '0.15' }}
          BURST: ${{ inputs.burst }}
          GAP: ${{ inputs.gap }}
          COOLDOWN: ${{ inputs.cooldown }}
        run: |
          left=$((CHAIN - 1))
          gh workflow run source-walk.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f chain="$left" -f budget="$BUDGET" -f pace="$PACE" \
            -f burst="$BURST" -f gap="$GAP" -f cooldown="$COOLDOWN"
          echo "chain: follow-up run requested; $left more may follow it"
